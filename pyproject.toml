[project]
name = "scene-recall"
version = "0.1.0"
description = "Source-backed semantic search over film libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=16,<18",
    "click>=8.4.2",
    "fastapi>=0.138.1",
    "faster-whisper>=1.2.1",
    "filelock>=3.30,<4",
    "google-genai>=2.10.0",
    "httpx>=0.28.1,<0.29",
    # Native FTS is experimental and its 0.33 index-maintenance contract is
    # covered by integration tests. Certify newer minor releases before use.
    "lancedb[embeddings]>=0.33,<0.34",
    "numpy>=1.26.0",
    "openai>=2.44.0",
    "open-clip-torch>=3.3,<4",
    "pillow>=10.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "timm>=1.0.27,<2",
    "transformers>=5.12.1",
    "transnetv2-pytorch>=1.0.5",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
lab = ["beat-this==1.1.0", "torchaudio>=2.11.0"]
# Local evidence measurement (subject detection); see pipeline/evidence/measure.py.
measure = ["rfdetr==1.11.0"]
algmods = [
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]
maintenance = ["pylance==9.0.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu128"}]
torchvision = [{index = "pytorch-cu128"}]
torchaudio = [{index = "pytorch-cu128"}]
