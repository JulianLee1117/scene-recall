paths:
  films_dir: V:/scene-recall/films                # source files (immutable)
  incoming_dir: V:/scene-recall/incoming          # completed downloads awaiting review
  state_dir: V:/scene-recall/state                # durable bookmarks and future user state
  assets_dir: C:/Users/julia/Videos/cinema-assets # derived: keyframes/, previews/, proxies/, db/
  playback_dir: V:/scene-recall/playback         # full-length browser audio compatibility copies

models:
  visual_encoder: pe_core_l14     # pe_core_l14 | siglip2_so400m
  text_encoder: qwen3-embedding-0.6b
  annotator_provider: openai      # openai | gemini
  annotator: gpt-5.6-luna         # high-volume vision annotation
  annotator_image_detail: low     # lower cost; test high if fine detail matters
  annotator_reasoning_effort: none
  whisper: large-v3               # faster-whisper model for subtitle fallback

thresholds:
  subsegment_min_duration: 20     # seconds; shots longer than this get sub-segmented
  flash_min_duration: 0.5         # seconds; shots shorter than this are flash/strobe artifacts
  keyframe_short_shot_s: 2.0      # seconds; short shots use beginning/middle/end native frames

ingest:
  annotation_concurrency: 8      # parallel hosted annotation requests per film

lab:
  harness: v1                   # v2: measured music + beat-lattice assembly for Regenerate edit (ADR-0096)
  footage_inspection: false     # bounded editor pilot; enable only for evaluated runs
  context_profile: null         # optional cached narrative context; pilot before activation
  music_provider: openai        # openai | gemini; independent of film annotation
  music_model: gpt-audio-1.5     # listens to actual audio, not only a transcript
  planner_model: gpt-5.6-terra   # text-only scene choices with Structured Outputs
  music_prompt_version: music-feeling-v3
  planner_prompt_version: source-timeline-v2
  beat_device: cpu              # optional Beat This! profile; see README preparation command

retrieval:
  weights: {img: 0.4, txt: 0.4, lex: 0.2}
  candidate_limit: 200       # base per-channel depth; unscoped broad search uses 3x
  result_window: 48          # initial stable ranked prefix returned by search
  max_result_limit: 200      # bounded deepest interactive result window
  rerank_shortlist: 40       # cross-encoder rerank of the fused shortlist (0 disables); ~+0.25 s
  diversity:
    page_size: 12
    film_results_per_page_target: 4  # soft preference; every page relevance-backfills
    film_repeat_rank_strength: 32    # bounded open-discovery repeat penalty; 0 keeps relevance order
