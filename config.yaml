paths:
  films_dir: V:/scene-recall/films                # source files (immutable)
  incoming_dir: V:/scene-recall/incoming          # completed downloads awaiting review
  state_dir: V:/scene-recall/state                # durable bookmarks and future user state
  assets_dir: C:/Users/julia/Videos/cinema-assets # derived: keyframes/, previews/, proxies/, db/

models:
  visual_encoder: pe_core_l14     # pe_core_l14 | siglip2_so400m
  text_encoder: qwen3-embedding-0.6b
  annotator_provider: openai      # openai | gemini
  annotator: gpt-5.6-luna         # high-volume vision annotation
  annotator_image_detail: low     # lower cost; test high if fine detail matters
  annotator_reasoning_effort: none
  whisper: large-v3               # faster-whisper model for subtitle fallback

thresholds:
  subsegment_min_duration: 20     # seconds; shots longer than this get sub-segmented
  flash_min_duration: 0.5         # seconds; shots shorter than this are flash/strobe artifacts
  keyframe_short_shot_s: 2.0      # seconds; shots shorter than this get 1 keyframe (midpoint)

ingest:
  annotation_concurrency: 8      # parallel hosted annotation requests per film

retrieval:
  weights: {img: 0.4, txt: 0.4, lex: 0.2}
  candidate_limit: 200       # base per-channel depth; unscoped broad search uses 3x
  result_window: 48          # stable ranked window returned by production search
  max_result_limit: 100      # bounded deeper window available to evaluations
  diversity:
    page_size: 12
    film_results_per_page_target: 4  # soft preference; every page relevance-backfills
