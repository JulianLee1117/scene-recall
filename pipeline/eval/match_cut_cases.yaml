schema_version: 1
kind: scene_recall_match_cut_cases

# Human-owned reference-frame judgments. A null criterion was not inspected;
# it is never scored as a mismatch. Grades: 0 = mismatch, 1 = weak/partial,
# 2 = usable match, 3 = strong match.
criteria:
  subject_object: Same principal subject or object types and counts.
  normalized_position: Principal subjects occupy corresponding frame positions.
  scale: Principal subjects have corresponding apparent size in the frame.
  viewpoint_orientation: Camera viewpoint and subject screen orientation correspond.
  pose: Articulated subject pose corresponds.
  relations_negative_space: Subject relations and surrounding negative space correspond.

instructions:
  - Judge match-cut geometry, not shared film style, color, setting, or identity alone.
  - Keep positives that would be useful with a small edit adjustment.
  - Use hard negatives for plausible retrieval confounders that should not survive final ranking.
  - Leave a criterion null until someone has inspected it; do not infer missing grades.

