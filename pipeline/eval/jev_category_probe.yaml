version: 1
kind: scene-recall-jev-category-probe
created: '2026-09-20'
state: frozen-agent-expectations-before-provider-calls
purpose: >-
  Test independent interpretation of positive requested search aspects. This
  query-only diagnostic does not run retrieval, infer film filters, judge source
  relevance, establish intuitive UI labels, or authorize production routing.
sampling:
  case_count: 24
  method: Agent-written isolated controls, contrast pairs, mixed descriptions and ambiguity probes.
  limits: >-
    Expected answers express this declared taxonomy, not human preference or
    objectively unique language interpretation. Related contrast cases are
    correlated. This is not an independent held-out retrieval evaluation.
  correlation_unit: group_id
expectation_policy:
  owner: agent-predeclared
  timing: Frozen before new provider responses; do not tune after seeing outputs.
  ambiguous_cases: Multiple listed answers are acceptable; report them separately from strict cases.
  negative_mentions: A category mentioned only to exclude it is not a desired positive aspect.
  scope: Only explicit_film_ids is confirmed scope; words resembling movie titles do not create scope.
  human_review: pending
definitions:
  content: >-
    Concrete depicted subjects, objects, actions or settings that the user wants
    to see. A generic speaker or a screen/sign mentioned solely as the source of
    requested words is not a separate content requirement. Naming a shot scale
    alone does not request a particular depicted subject.
  appearance: >-
    Desired lighting, color, silhouette treatment, texture, visual period or
    visual style. Do not infer a visual treatment from an emotion alone.
  framing: >-
    Desired shot scale, camera angle, screen direction, subject arrangement or
    composition. This describes query intent, not availability of exact filters.
  mood: >-
    Desired emotional atmosphere or feeling of the scene. Do not infer a mood
    just because a visually depicted action could have emotional implications.
  dialogue: >-
    Requested audible speech or spoken wording. Quote marks alone do not establish
    whether words should be heard, read, or interpreted as a concept.
  on_screen_text: >-
    Requested visible written words, letters or signage. Do not activate solely
    because the query excludes writing, or because a screen appears without a
    request for its written content.
  narrative_context: >-
    Requested story role, causal relationship, knowledge or realization, event
    significance, or metaphor/symbolism beyond an observable moment. Ordinary
    action order and a remembered scene's location alone do not establish this.
cases:
  - id: concrete_subjects
    group_id: isolated
    query: two people waiting at a bus stop
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Concrete people, action and place; other aspects are unstated.
  - id: appearance_only
    group_id: isolated
    query: cold blue lighting with heavy film grain
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['yes'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Lighting and texture do not independently request a subject or emotion.
  - id: framing_only
    group_id: isolated
    query: an extreme close-up from a low angle
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['yes'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Scale and angle are specified without a particular subject.
  - id: mood_only
    group_id: isolated
    query: uneasy, lonely and emotionally distant
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['yes'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Feelings alone do not prescribe visible facts or a plot event.
  - id: spoken_quote
    group_id: quoted_words
    query: someone saying the exact line "I'll be back"
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['yes'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Generic speaker is source scaffolding; the positive request is audible wording.
  - id: visible_quote
    group_id: quoted_words
    query: the words "NO VACANCY" printed on a sign
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['yes'], narrative_context: ['no']}
    rationale: Generic sign identifies the requested word source, with no separate visual requirement.
  - id: causal_realization
    group_id: context
    query: the moment the character realizes their closest friend betrayed them
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['yes']}
    rationale: A realization and relationship require story evidence, with no particular visible action specified.
  - id: mixed_shot_style_mood
    group_id: mixed
    query: medium shot of two people under cold neon light, feeling distant, neo noir
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['yes'], framing: ['yes'], mood: ['yes'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Positive subjects, scale, treatment and emotion coexist without a required plot explanation.
  - id: directional_silhouette
    group_id: shot_constraints
    query: tight shot of a woman in profile facing right, not left, a silhouette against a bright window
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['yes'], framing: ['yes'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Subject, light treatment and directional composition are distinct positive requests.
  - id: proximity_no_kiss
    group_id: kiss_contrast
    query: two people standing close but not kissing
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Requested action/proximity with an exclusion does not by itself establish romantic mood.
  - id: tension_no_kiss
    group_id: kiss_contrast
    query: romantic tension between two people, but no kissing
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['yes'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: People and romantic atmosphere are explicit; no larger story role is requested.
  - id: action_not_words
    group_id: source_negation
    query: a person shown waking up; no dialogue and no writing onscreen
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Speech and writing are excluded, so neither is a desired source category.
  - id: visible_not_spoken
    group_id: source_negation
    query: written words "wake up" on a monitor, not somebody saying them
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['yes'], narrative_context: ['no']}
    rationale: The positive source is visible words; the spoken alternative is expressly excluded.
  - id: spoken_not_visible
    group_id: source_negation
    query: someone says "wake up", not those words written on a screen
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['yes'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: The positive source is audible words; the written alternative is expressly excluded.
  - id: quoted_concept
    group_id: quoted_words
    query: "'loneliness' as a mood, not words on a sign or dialogue"
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['yes'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: The quoted word explicitly names a feeling rather than literal wording to find.
  - id: bare_quote_ambiguous
    group_id: ambiguity
    query: '"I will be back"'
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['yes', 'unclear'], on_screen_text: ['yes', 'unclear'], narrative_context: ['no']}
    rationale: A literal quote is plausible but its source is unexpressed; do not treat a source guess as scope authority.
    ambiguity: Dialogue and visible text each permit yes or unclear; report separately from strict source tests.
  - id: bare_blue_ambiguous
    group_id: ambiguity
    query: blue
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['yes', 'unclear'], framing: ['no'], mood: ['yes', 'unclear', 'no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Color is the leading reading, while mood or a title may be intended; no film is confirmed.
    ambiguity: Appearance and mood are exploratory, not strict accuracy endpoints.
  - id: movie_words_unconfirmed
    group_id: film_authority
    query: the scene in Before Sunrise where two people quietly exchange glances
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Concrete action remains content; title words do not authorize a filter or supply missing mood/plot facts.
  - id: movie_scope_confirmed
    group_id: film_authority
    query: two people quietly exchange glances
    explicit_film_ids: [f23d5e2cbcf85f03df1196cbb15cd480dea75b76f3856d34adecae9c7ee00972]
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: A confirmed movie changes scope, not the requested category labels.
  - id: title_word_as_description
    group_id: film_authority
    query: moonlight reflected on a lake
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['yes'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Visible place and light are requested; the ordinary word moonlight is not a movie filter.
  - id: typo_mixed
    group_id: mixed
    query: medum shot of 2 ppl in cold bloo light, feelin tense
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['yes'], framing: ['yes'], mood: ['yes'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Ordinary typos preserve the four explicit positive aspects.
  - id: later_story_reversal
    group_id: context
    query: a small kindness that later becomes a betrayal
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['yes']}
    rationale: Later significance requires temporal story context; the visible act itself is unspecified.
  - id: metaphor_visible_anchor
    group_id: context
    query: a caged bird that could symbolize a character losing their freedom
    explicit_film_ids: []
    expected: {content: ['yes'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['yes']}
    rationale: Concrete bird plus a requested potential metaphor; interpretation is not asserted as canonical plot fact.
  - id: exclusions_only
    group_id: source_negation
    query: not dialogue, not text, surprise me
    explicit_film_ids: []
    expected: {content: ['no'], appearance: ['no'], framing: ['no'], mood: ['no'], dialogue: ['no'], on_screen_text: ['no'], narrative_context: ['no']}
    rationale: Negative constraints exist but no positive category is named; a no label must not discard those exclusions.
