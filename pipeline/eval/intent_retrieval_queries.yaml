version: 1
kind: scene-recall-intent-retrieval-queries
created: '2026-09-21'
purpose: Compare original hybrid retrieval, fixed supplemental evidence retrieval, and Jev-planned supplemental
  retrieval. No automatic promotion.
provenance:
  source_fixture: pipeline/eval/search_intent_queries.yaml
  source_fixture_sha256: 1e3455dc02f6c816f4b7fb5327951558273cb554946fe689fc6b19d8278943f7
  source_evidence_policy:
    frame_verified: An agent visually inspected the retained frame at its indexed timestamp. This is not human
      relevance judgment, full-shot playback, proof of motion or narrative truth.
    source_verified: Reserved for source playback verification; no new window in this fixture is assigned this
      status.
    timed_text_provisional: Exact retained timed text was read, but audio synchronization, translation, speakers
      or source lineage remain unverified. Exclude from verified-positive metrics.
    caption_only_provisional: A caption-derived hypothesis that has not been visually checked; never treat
      as a verified positive.
    reference_coverage: Expected windows are known references, not exhaustive relevance labels. Other matching
      results may be valid; missing an unjudged scene is not automatically a ranking error.
    negative_controls: An exclusion identifies a checked local contradiction only. An empty expected_windows
      list never asserts that the whole corpus has no positives.
    human_review: All human factual, relevance and played judgments remain pending; no machine scores are acceptance.
  selection_limits: Eleven historical targeted queries plus five author-written explorations. References are
    incomplete and correlated; no representative recall or human relevance claim. Confirmed film scope is only
    film_ids, never title-like words in query.
