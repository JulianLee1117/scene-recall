version: 1
kind: scene-recall-search-intent-queries
created: '2026-09-20'
state: frozen-agent-evidence-set-human-review-pending
purpose: Compare unchanged retrieval and bounded Jev-assisted variants on the same source-backed query
  set; no production activation.
sampling:
  query_count: 25
  anchor_count: 10
  film_count: 8
  method: One user-provided known scene plus targeted caption/scalar reconnaissance and direct retained-frame
    inspection; related paraphrases intentionally share anchors.
  selection_bias: Most other anchors were located through existing caption/OCR evidence and are not
    a random or independent recall sample. No semantic search results were used to choose them in
    this task.
  correlation_unit: group_id; report grouped results as well as per-query diagnostics
evidence_policy:
  frame_verified: An agent visually inspected the retained frame at its indexed timestamp. This is
    not human relevance judgment, full-shot playback, proof of motion or narrative truth.
  source_verified: Reserved for source playback verification; no new window in this fixture is assigned
    this status.
  timed_text_provisional: Exact retained timed text was read, but audio synchronization, translation,
    speakers or source lineage remain unverified. Exclude from verified-positive metrics.
  caption_only_provisional: A caption-derived hypothesis that has not been visually checked; never
    treat as a verified positive.
  reference_coverage: Expected windows are known references, not exhaustive relevance labels. Other
    matching results may be valid; missing an unjudged scene is not automatically a ranking error.
  negative_controls: An exclusion identifies a checked local contradiction only. An empty expected_windows
    list never asserts that the whole corpus has no positives.
  human_review: All human factual, relevance and played judgments remain pending; no machine scores
    are acceptance.
corpus_observation:
  assets_root_variable: config.paths.assets_dir
  table_versions_observed:
    films: 167
    units: 986
    frames: 495
  source_identity: Existing film_id (sha256-head-tail-4MiB source identity), source-player-seconds
    intervals, unit identity and retained frame SHA256.
  note: These versions describe evidence reconnaissance, not the later comparison capture; revalidate
    sources and freeze each comparison's own table versions.
